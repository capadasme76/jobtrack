name: Generate search insights

on:
  schedule:
    - cron: "0 12 * * 1" # lunes ~9am Chile (UTC-3)
  workflow_dispatch:
    inputs:
      test_to:
        description: "Solo para pruebas: si lo llenas (uno o más correos separados por coma), el reporte de esta corrida se manda SOLO ahí en vez de a la lista real."
        required: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run report
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TEST_REPORT_TO: ${{ github.event.inputs.test_to }}
        run: node scripts/generate-search-insights.mjs
