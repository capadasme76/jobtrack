name: Check watched job pages

on:
  schedule:
    - cron: "0 11 * * *" # ~8am Chile (UTC-3), ajusta si cambia el horario de verano
  workflow_dispatch:
    inputs:
      test_email:
        description: "Solo para pruebas: si lo llenas, el resumen diario de esta corrida se manda SOLO a este correo (con su data real, sin importar su estado de suscripción) y a nadie más."
        required: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run watcher
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TEST_DIGEST_EMAIL: ${{ github.event.inputs.test_email }}
        run: node scripts/check-watched-pages.mjs
