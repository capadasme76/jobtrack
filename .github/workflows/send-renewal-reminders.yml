name: Send renewal reminders

on:
  schedule:
    - cron: "0 12 * * *" # ~9am Chile (UTC-3), después del check de búsquedas vigiladas
  workflow_dispatch:
    inputs:
      test_email:
        description: "Solo para pruebas: si lo llenas, se manda SOLO a este correo (con su data real)."
        required: false
      test_day:
        description: "Solo con test_email: qué día simular — 2, 1 o 0 (día que vence). Por defecto 0."
        required: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run reminder sender
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TEST_REMINDER_EMAIL: ${{ github.event.inputs.test_email }}
          TEST_REMINDER_DAY: ${{ github.event.inputs.test_day }}
        run: node scripts/send-renewal-reminders.mjs
