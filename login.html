<!DOCTYPE html>
<html lang="es">
<head>
<script src="/analytics.js"></script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JobTrack — Iniciar sesión</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#7C5CFC">
</head>
<body>
<style>
  :root{
    --paper:#F3F2F2;
    --paper-dim:#EAE9E9;
    --ink:#201E1D;
    --ink-soft:#605D5D;
    --ink-faint:#9B9797;
    --line:#D7D3D3;
    --brick:#7C5CFC;
    --brick-dark:#5A3FD9;
    --card-bg:#FFFFFF;
    --font-display:'Archivo',system-ui,sans-serif;
    --font-body:'Archivo',system-ui,sans-serif;
    --font-mono:'Archivo',monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--font-body);color:var(--ink);background:var(--paper);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .jt-login-logo{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:24px;}
  .jt-login-logo .name{font-family:var(--font-display);font-weight:700;font-size:17px;}
  .jt-logo-dot{display:inline-block;width:0.33em;height:0.33em;background:var(--brick);margin-left:0.12em;vertical-align:-0.06em;}
  .jt-login-box{width:100%;max-width:360px;}
  .jt-login-card{background:var(--card-bg);border:1px solid var(--line);padding:28px;box-shadow:0 1px 2px rgba(32,30,29,.14);}
  .jt-login-card h1{font-family:var(--font-display);font-size:20px;font-weight:700;margin:0 0 18px;text-align:center;}
  .jt-login-card label{display:block;font-family:var(--font-mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-faint);margin-bottom:4px;}
  .jt-login-field{margin-bottom:14px;}
  .jt-login-field input{width:100%;font-family:var(--font-body);font-size:14.5px;background:var(--paper);color:var(--ink);border:1px solid var(--line);padding:10px 11px;}
  .jt-login-field input:focus-visible{outline:2px solid var(--brick);outline-offset:1px;}
  .jt-login-pw-wrap{position:relative;}
  .jt-login-pw-wrap input{padding-right:60px;}
  .jt-login-pw-toggle{position:absolute;right:0;top:0;bottom:0;font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.3px;color:var(--ink-faint);background:none;border:none;padding:0 11px;cursor:pointer;}
  .jt-login-pw-toggle:hover{color:var(--ink-soft);}
  .jt-login-submit{width:100%;font-family:var(--font-body);font-weight:600;font-size:14.5px;background:var(--brick);color:#fff;border:1px solid var(--brick);padding:11px 16px;cursor:pointer;margin-top:4px;}
  .jt-login-submit:hover{border-color:var(--brick-dark);background:var(--brick-dark);}
  .jt-login-submit:disabled{opacity:.6;cursor:default;}
  .jt-login-switch{text-align:center;font-size:13.5px;color:var(--ink-soft);margin-top:16px;}
  .jt-login-forgot{text-align:center;margin-top:10px;}
  .jt-login-forgot button{font-family:var(--font-mono);font-size:12px;color:var(--ink-faint);background:none;border:none;cursor:pointer;padding:0;text-decoration:underline;}
  .jt-login-forgot button:hover{color:var(--ink-soft);}
  .jt-login-resend{text-align:center;margin-top:6px;}
  .jt-login-resend button{font-family:var(--font-mono);font-size:12px;color:var(--ink-faint);background:none;border:none;cursor:pointer;padding:0;text-decoration:underline;}
  .jt-login-resend button:hover{color:var(--ink-soft);}
  .jt-login-resend button:disabled{cursor:default;text-decoration:none;opacity:.7;}
  .jt-login-legal{font-size:12px;line-height:1.5;color:var(--ink-faint);margin:0 0 10px;}
  .jt-login-legal a{color:var(--brick);}
  .jt-login-switch button{font-family:var(--font-body);font-size:13.5px;color:var(--brick);background:none;border:none;cursor:pointer;padding:0;text-decoration:underline;}
  .jt-login-err{font-family:var(--font-mono);font-size:13px;color:var(--brick);margin-bottom:12px;display:none;}
  .jt-login-info{font-family:var(--font-mono);font-size:13px;color:var(--teal-dark,#0F4A2E);margin-bottom:12px;display:none;}
  .jt-login-back{display:block;text-align:center;font-family:var(--font-mono);font-size:12px;color:var(--ink-faint);text-decoration:none;margin-top:18px;}
  .jt-login-back:hover{color:var(--ink-soft);}
  .jt-login-session-notice{font-family:var(--font-body);font-size:13.5px;color:var(--ink);background:var(--paper-dim);border:1px solid var(--line);padding:14px;margin-bottom:16px;display:none;}
  .jt-login-session-notice p{margin:0 0 10px;}
  .jt-login-session-notice button{width:100%;font-family:var(--font-body);font-weight:600;font-size:13.5px;background:var(--card-bg);color:var(--ink);border:1px solid var(--line);padding:9px 12px;cursor:pointer;}
  .jt-login-session-notice button:hover{border-color:var(--ink-soft);}
  .jt-login-session-notice button#jt-login-session-continue{background:var(--brick);color:#fff;border-color:var(--brick);margin-bottom:8px;}
  .jt-login-session-notice button#jt-login-session-continue:hover{background:var(--brick-dark);border-color:var(--brick-dark);}
</style>

<div class="jt-login-box">
  <div class="jt-login-logo">
    <div class="name">JobTrack<span class="jt-logo-dot"></span></div>
  </div>
  <div class="jt-login-card">
    <h1 id="jt-login-title">Iniciar sesión</h1>
    <div class="jt-login-session-notice" id="jt-login-session-notice">
      <p id="jt-login-session-text"></p>
      <button type="button" id="jt-login-session-continue" style="display:none;">Continuar con esta cuenta</button>
      <button type="button" id="jt-login-session-signout">Cerrar esa sesión y continuar</button>
    </div>
    <div class="jt-login-err" id="jt-login-err"></div>
    <div class="jt-login-info" id="jt-login-info"></div>
    <div class="jt-login-resend" id="jt-login-resend" style="display:none;">
      <button type="button" id="jt-login-resend-btn">Reenviar correo de confirmación</button>
    </div>
    <form id="jt-login-form">
      <div class="jt-login-field" id="jt-login-email-field">
        <label for="jt-login-email">Email</label>
        <input type="email" id="jt-login-email" autocomplete="email" required />
      </div>
      <div class="jt-login-field" id="jt-login-password-field">
        <label for="jt-login-password" id="jt-login-password-label">Contraseña</label>
        <div class="jt-login-pw-wrap">
          <input type="password" id="jt-login-password" autocomplete="current-password" required minlength="6" />
          <button type="button" class="jt-login-pw-toggle" id="jt-login-pw-toggle">Ver</button>
        </div>
      </div>
      <p class="jt-login-legal" id="jt-login-legal" style="display:none;">Al crear tu cuenta aceptas los <a href="terminos.html" target="_blank">Términos y Condiciones</a> y la <a href="privacidad.html" target="_blank">Política de Privacidad</a>.</p>
      <button type="submit" class="jt-login-submit" id="jt-login-submit">Iniciar sesión</button>
    </form>
    <div class="jt-login-forgot" id="jt-login-forgot">
      <button type="button" id="jt-login-forgot-btn">¿Olvidaste tu contraseña?</button>
    </div>
    <div class="jt-login-switch" id="jt-login-switch">
      <span id="jt-login-switch-text">¿No tienes cuenta?</span>
      <button type="button" id="jt-login-switch-btn">Créala aquí</button>
    </div>
  </div>
  <a class="jt-login-back" href="index.html">← Volver al inicio</a>
</div>

<script type="module">
  import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
  import { SUPABASE_URL, SUPABASE_ANON_KEY } from "./supabase-config.js";

  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const params = new URLSearchParams(location.search);
  let mode = params.get("mode") === "signup" ? "signup" : "login";

  const title = document.getElementById("jt-login-title");
  const submitBtn = document.getElementById("jt-login-submit");
  const switchText = document.getElementById("jt-login-switch-text");
  const switchBtn = document.getElementById("jt-login-switch-btn");
  const errBox = document.getElementById("jt-login-err");
  const infoBox = document.getElementById("jt-login-info");
  const resendWrap = document.getElementById("jt-login-resend");
  const resendBtn = document.getElementById("jt-login-resend-btn");
  let pendingConfirmEmail = "";
  const form = document.getElementById("jt-login-form");
  const emailInput = document.getElementById("jt-login-email");
  const passwordInput = document.getElementById("jt-login-password");
  const sessionNotice = document.getElementById("jt-login-session-notice");
  const sessionText = document.getElementById("jt-login-session-text");
  const sessionSignoutBtn = document.getElementById("jt-login-session-signout");
  const sessionContinueBtn = document.getElementById("jt-login-session-continue");
  const pwToggle = document.getElementById("jt-login-pw-toggle");
  const emailField = document.getElementById("jt-login-email-field");
  const passwordField = document.getElementById("jt-login-password-field");
  const passwordLabel = document.getElementById("jt-login-password-label");
  const forgotWrap = document.getElementById("jt-login-forgot");
  const forgotBtn = document.getElementById("jt-login-forgot-btn");
  const switchWrap = document.getElementById("jt-login-switch");

  let recoveryActive = false;

  pwToggle.addEventListener("click", function(){
    var showing = passwordInput.type === "text";
    passwordInput.type = showing ? "password" : "text";
    pwToggle.textContent = showing ? "Ver" : "Ocultar";
  });

  // Supabase procesa el link de recuperación de contraseña apenas se crea el
  // cliente (lee el token de la URL) y avisa acá — hay que interceptarlo antes
  // de que checkSessionAndApply() redirija al dashboard creyendo que es un login normal.
  supabase.auth.onAuthStateChange(function(event){
    if(event === "PASSWORD_RECOVERY"){
      recoveryActive = true;
      mode = "recovery";
      sessionNotice.style.display = "none";
      form.style.display = "block";
      applyMode();
    }
  });

  function applyMode(){
    emailField.style.display = mode === "recovery" ? "none" : "block";
    emailInput.required = mode !== "recovery";
    passwordField.style.display = mode === "forgot" ? "none" : "block";
    passwordInput.required = mode !== "forgot";
    passwordInput.autocomplete = mode === "recovery" ? "new-password" : "current-password";
    forgotWrap.style.display = mode === "login" ? "block" : "none";
    switchWrap.style.display = mode === "recovery" ? "none" : "block";
    document.getElementById("jt-login-legal").style.display = mode === "signup" ? "block" : "none";

    if(mode === "signup"){
      title.textContent = "Crear cuenta";
      submitBtn.textContent = "Crear cuenta";
      switchText.textContent = "¿Ya tienes cuenta?";
      switchBtn.textContent = "Inicia sesión";
    } else if(mode === "forgot"){
      title.textContent = "Recuperar contraseña";
      passwordLabel.textContent = "Contraseña";
      submitBtn.textContent = "Enviar link de recuperación";
      switchText.textContent = "¿Recordaste tu contraseña?";
      switchBtn.textContent = "Inicia sesión";
    } else if(mode === "recovery"){
      title.textContent = "Elige una nueva contraseña";
      passwordLabel.textContent = "Nueva contraseña";
      submitBtn.textContent = "Guardar nueva contraseña";
    } else {
      title.textContent = "Iniciar sesión";
      passwordLabel.textContent = "Contraseña";
      submitBtn.textContent = "Iniciar sesión";
      switchText.textContent = "¿No tienes cuenta?";
      switchBtn.textContent = "Créala aquí";
    }
    errBox.style.display = "none";
    infoBox.style.display = "none";
    resendWrap.style.display = "none";
  }
  applyMode();

  // Si ya hay sesión activa, NUNCA saltar en silencio al dashboard — ni en
  // login ni en signup. Un navegador compartido/reusado puede tener la sesión
  // de otra persona guardada, y saltar directo metía a quien fuera a escribir
  // su propio correo/clave derecho a la cuenta ajena que seguía abierta ahí,
  // sin darle la oportunidad de cerrarla primero. Siempre se avisa y se pide
  // confirmación explícita. En recuperación tampoco: recoveryActive corta el
  // salto para mostrar el formulario de nueva contraseña.
  function checkSessionAndApply(){
    supabase.auth.getSession().then(function(res){
      if(recoveryActive) return;
      var session = res.data.session;
      if(!session){
        sessionNotice.style.display = "none";
        form.style.display = "block";
        return;
      }
      if(mode === "signup"){
        sessionText.textContent = "Ya hay una sesión abierta en este navegador como " + session.user.email + ". Para crear una cuenta nueva, primero cierra esa sesión.";
        sessionContinueBtn.style.display = "none";
        sessionNotice.style.display = "block";
        form.style.display = "none";
      } else if(mode === "login"){
        sessionText.textContent = "Ya hay una sesión abierta en este navegador como " + session.user.email + ". ¿Es tu cuenta?";
        sessionContinueBtn.style.display = "block";
        sessionNotice.style.display = "block";
        form.style.display = "none";
      }
    });
  }

  sessionContinueBtn.addEventListener("click", function(){
    location.href = "jobtrack-dashboard-cristian.html";
  });

  // Ninguna llamada a Supabase tenía límite de tiempo — si el servidor tarda
  // (carga, plan gratuito bajo mucho tráfico, etc.), el botón se quedaba
  // pegado en "Un momento…" para siempre, sin avisar nada. Con esto, después
  // de TIMEOUT_MS se corta la espera y se muestra un error claro en vez de
  // colgar la pantalla en silencio.
  var TIMEOUT_MS = 20000;
  function withTimeout(promise){
    return Promise.race([
      promise,
      new Promise(function(_, reject){
        setTimeout(function(){ reject(new Error("TIMEOUT")); }, TIMEOUT_MS);
      })
    ]);
  }

  switchBtn.addEventListener("click", function(){
    mode = mode === "login" ? "signup" : "login";
    applyMode();
    checkSessionAndApply();
  });

  forgotBtn.addEventListener("click", function(){
    mode = "forgot";
    sessionNotice.style.display = "none";
    form.style.display = "block";
    applyMode();
  });

  checkSessionAndApply();

  function translateAuthError(err){
    var msg = (err && err.message) || "";
    var waitMatch = msg.match(/after (\d+) seconds/i);
    if(waitMatch){
      return "Por seguridad, espera " + waitMatch[1] + " segundos antes de volver a intentarlo — no hace falta hacer clic varias veces, el botón ya registró tu primer intento.";
    }
    if(/already registered/i.test(msg)){
      return "Ya existe una cuenta con ese correo. Prueba iniciar sesión o usa \"¿Olvidaste tu contraseña?\".";
    }
    if(/invalid login credentials/i.test(msg)){
      return "Correo o contraseña incorrectos.";
    }
    if(/email not confirmed/i.test(msg)){
      return "Todavía no confirmaste tu correo. Revisa tu bandeja (y spam) o usa el botón de abajo para que te reenviemos el link.";
    }
    if(msg === "TIMEOUT"){
      return "El servidor está tardando más de lo normal en responder. Espera unos segundos e intenta de nuevo — si ya se había procesado, no pasa nada por reintentar.";
    }
    if(/password should be at least/i.test(msg)){
      return "La contraseña debe tener al menos 6 caracteres.";
    }
    return msg || "Ocurrió un error, intenta de nuevo.";
  }

  resendBtn.addEventListener("click", async function(){
    if(!pendingConfirmEmail) return;
    resendBtn.disabled = true;
    var originalResendLabel = resendBtn.textContent;
    resendBtn.textContent = "Enviando…";
    try{
      const { error } = await withTimeout(supabase.auth.resend({ type: "signup", email: pendingConfirmEmail }));
      if(error) throw error;
      infoBox.textContent = "Te reenviamos el correo de confirmación a " + pendingConfirmEmail + " — revisa tu bandeja (y spam) en unos minutos.";
      infoBox.style.display = "block";
      errBox.style.display = "none";
    } catch(err){
      errBox.textContent = translateAuthError(err);
      errBox.style.display = "block";
    } finally {
      resendBtn.disabled = false;
      resendBtn.textContent = originalResendLabel;
    }
  });

  sessionSignoutBtn.addEventListener("click", async function(){
    sessionSignoutBtn.disabled = true;
    await supabase.auth.signOut();
    sessionNotice.style.display = "none";
    form.style.display = "block";
    sessionSignoutBtn.disabled = false;
  });

  form.addEventListener("submit", async function(e){
    e.preventDefault();
    errBox.style.display = "none";
    infoBox.style.display = "none";
    resendWrap.style.display = "none";
    var originalLabel = submitBtn.textContent;
    submitBtn.disabled = true;
    submitBtn.textContent = "Un momento…";
    const email = emailInput.value.trim();
    const password = passwordInput.value;

    try{
      if(mode === "signup"){
        const { data, error } = await withTimeout(supabase.auth.signUp({ email, password, options: { emailRedirectTo: location.origin + "/login.html" } }));
        if(error) throw error;
        if(data.session){
          location.href = "jobtrack-dashboard-cristian.html";
        } else {
          infoBox.textContent = "Cuenta creada. Revisa tu correo para confirmar antes de iniciar sesión.";
          infoBox.style.display = "block";
          pendingConfirmEmail = email;
          resendWrap.style.display = "block";
        }
      } else if(mode === "forgot"){
        const { error } = await withTimeout(supabase.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname }));
        if(error) throw error;
        mode = "login";
        applyMode();
        infoBox.textContent = "Si existe una cuenta con ese correo, te enviamos un link para recuperar tu contraseña.";
        infoBox.style.display = "block";
      } else if(mode === "recovery"){
        const { error } = await withTimeout(supabase.auth.updateUser({ password }));
        if(error) throw error;
        location.href = "jobtrack-dashboard-cristian.html";
      } else {
        const { error } = await withTimeout(supabase.auth.signInWithPassword({ email, password }));
        if(error) throw error;
        location.href = "jobtrack-dashboard-cristian.html";
      }
    } catch(err){
      errBox.textContent = translateAuthError(err);
      errBox.style.display = "block";
      if(/email not confirmed/i.test((err && err.message) || "")){
        pendingConfirmEmail = email;
        resendWrap.style.display = "block";
      }
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = originalLabel;
    }
  });
</script>

</body>
</html>
